[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
log = "0.4.35"
serde = "1.0.229"
serde_json = "1.0.154"
simplelog = "0.12.2"
sqlx = { version = "0.9.0", features = ["postgres", "macros", "time"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
